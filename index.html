<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AHMED TV</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Firebase (compat build) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- Clappr Player Engine -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
  <style>
    :root {
      --bg: #0a0e1a;
      --bg-header: #05070f;
      --card: #141a2b;
      --card-2: #1a2138;
      --accent: #7c3aed;
      --accent-light: #9333ea;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --text-muted: #5b6478;
      --danger: #ef4444;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; height: 100%; }
    body {
      background: linear-gradient(180deg, var(--bg) 0%, #070b14 100%);
      color: var(--text);
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 0px; background: transparent; }

    .spinner-overlay {
      position: fixed; inset: 0; background: var(--bg); z-index: 2000;
      display: flex; justify-content: center; align-items: center;
      transition: opacity .3s ease;
    }
    .spinner-wrapper { text-align: center; }
    .spinner-ring {
      width: 50px; height: 50px; border: 3px solid transparent;
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 15px; position: relative;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-text { color: var(--text-dim); font-size: 13px; font-weight: 600; }

    .header {
      padding: max(16px, env(safe-area-inset-top)) 16px 12px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(5, 7, 15, 0.8); backdrop-filter: blur(15px);
      position: sticky; top: 0; z-index: 90; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .menu-icon, .header-btn {
      width: 40px; height: 40px; border-radius: 12px; background: var(--card);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--text); cursor: pointer; border: 1px solid rgba(255,255,255,0.06);
    }
    .app-logo { font-size: 20px; font-weight: 900; }
    .app-logo span { background: linear-gradient(135deg, var(--accent), var(--accent-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .global-search { position: relative; flex: 1; max-width: 200px; margin: 0 10px; }
    .global-search input {
      width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px; padding: 8px 12px 8px 34px; color: #fff; font-size: 12px; outline: none;
    }
    .global-search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px; }

    .filter-container { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; white-space: nowrap; }
    .filter-pill {
      background: var(--card); padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700;
      color: var(--text-dim); cursor: pointer; border: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;
    }
    .filter-pill.active { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: #fff; }

    .section-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 10px; }
    .section-title { font-size: 15px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
    .section-title i { color: var(--accent); }
    .view-all { font-size: 12px; color: var(--accent-light); cursor: pointer; font-weight: 700; }

    .movies-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px; }
    .movie-card {
      background: var(--card); border-radius: var(--radius-sm); overflow: hidden;
      cursor: pointer; position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-sm);
    }
    .movie-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #151c2e; display: block; }
    .movie-title { position: absolute; bottom: 0; left: 0; right: 0; font-size: 11px; font-weight: 700; color: #fff; padding: 20px 6px 8px; text-align: center; background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-fav {
      position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.5); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; z-index: 3;
    }
    .card-fav.active { color: var(--danger); }

    .chip-grid { display: flex; gap: 10px; padding: 0 16px; overflow-x: auto; white-space: nowrap; }
    .chip-card { background: var(--card); border-radius: var(--radius-md); padding: 10px; text-align: center; cursor: pointer; min-width: 100px; flex-shrink: 0; position: relative; }
    .chip-card img { width: 100%; max-height: 28px; object-fit: contain; margin-bottom: 6px; }
    .chip-card .chip-title { font-size: 11px; color: #e2e8f0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }

    .live-channels-grid { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
    .channel-item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--radius-md); padding: 10px 14px; cursor: pointer; }
    .channel-logo-box { width: 44px; height: 44px; border-radius: 10px; background: #0d1220; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .channel-logo-box img { max-width: 34px; max-height: 28px; object-fit: contain; }
    .channel-info { flex: 1; min-width: 0; }
    .channel-name { font-size: 13.5px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .channel-play-btn { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: calc(60px + env(safe-area-inset-bottom));
      background: rgba(10, 14, 26, 0.95); backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-around; align-items: center; z-index: 100;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; font-weight: 700; gap: 4px; cursor: pointer; flex: 1; }
    .nav-item.active { color: var(--accent-light); }
    .nav-item i { font-size: 18px; }

    .player-overlay { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; }
    .player-overlay.active { display: flex; }
    .player-topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 16px; background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent); }
    .player-back { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; }
    .player-title { color: #fff; font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #clapprPlayer { width: 100%; height: 100%; background: #000; }

    .modal { position: fixed; inset: 0; background: rgba(5, 7, 15, 0.98); z-index: 3000; display: none; flex-direction: column; padding: 20px; }
    .modal.active { display: flex; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .episodes-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .episode-item { background: var(--card); padding: 14px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

    .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 3500; display: none; }
    .drawer-backdrop.active { display: block; }
    .drawer { position: fixed; top: 0; right: 0; width: 70%; max-width: 280px; height: 100%; background: #0b0f1d; z-index: 3600; transform: translateX(100%); transition: transform 0.3s ease; padding: 20px; }
    .drawer.active { transform: translateX(0); }
    .drawer-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; cursor: pointer; color: #cbd5e1; font-weight: 700; font-size: 13px; }
    
    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-dim); text-align: center; grid-column: 1 / -1; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div id="globalSpinner" class="spinner-overlay">
    <div class="spinner-wrapper">
      <div class="spinner-ring"></div>
      <div class="spinner-text">جاري التحميل السريع...</div>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
  <div class="drawer" id="sideDrawer">
    <div style="font-size:20px; font-weight:900; margin-bottom:20px; text-align:center;">AHMED <span style="color:var(--accent-light)">TV</span></div>
    <div class="drawer-item" onclick="switchTab('home'); closeDrawer();"><i class="fa-solid fa-house"></i><span>الرئيسية</span></div>
    <div class="drawer-item" onclick="switchTab('archive'); closeDrawer();"><i class="fa-solid fa-box-archive"></i><span>سجل المشاهدة</span></div>
    <div class="drawer-item" onclick="switchTab('favorites'); closeDrawer();"><i class="fa-solid fa-heart"></i><span>المفضلة</span></div>
  </div>

  <div class="header">
    <div class="menu-icon" onclick="openDrawer()"><i class="fa-solid fa-bars"></i></div>
    <div class="app-logo">AHMED <span>TV</span></div>
    <div class="global-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="globalSearchInput" placeholder="ابحث..." oninput="debouncedSearch()">
    </div>
    <div class="header-btn" onclick="switchTab('favorites')"><i class="fa-solid fa-heart"></i></div>
  </div>

  <div id="tab-home-content" class="tab-content active">
    <div class="section-header">
      <div class="section-title"><i class="fa-solid fa-tower-broadcast"></i> قنوات مباشرة</div>
      <div class="view-all" onclick="switchTab('live')">عرض الكل</div>
    </div>
    <div class="chip-grid" id="homeLiveContainer"></div>

    <div class="section-header">
      <div class="section-title"><i class="fa-solid fa-film"></i> أحدث الأفلام</div>
      <div class="view-all" onclick="switchTab('movies')">عرض الكل</div>
    </div>
    <div class="movies-grid" id="homeMoviesContainer"></div>

    <div class="section-header">
      <div class="section-title"><i class="fa-solid fa-video"></i> أحدث المسلسلات</div>
      <div class="view-all" onclick="switchTab('series')">عرض الكل</div>
    </div>
    <div class="movies-grid" id="homeSeriesContainer"></div>
  </div>

  <div id="tab-live-content" class="tab-content">
    <div class="section-header"><div class="section-title"><i class="fa-solid fa-tower-broadcast"></i> البث المباشر</div></div>
    <div class="filter-container" id="liveFilters"></div>
    <div class="live-channels-grid" id="fullLiveContainer"></div>
  </div>

  <div id="tab-movies-content" class="tab-content">
    <div class="section-header"><div class="section-title"><i class="fa-solid fa-film"></i> الأفلام</div></div>
    <div class="filter-container" id="moviesFilters"></div>
    <div class="movies-grid" id="fullMoviesContainer"></div>
  </div>

  <div id="tab-series-content" class="tab-content">
    <div class="section-header"><div class="section-title"><i class="fa-solid fa-video"></i> المسلسلات</div></div>
    <div class="filter-container" id="seriesFilters"></div>
    <div class="movies-grid" id="fullSeriesContainer"></div>
  </div>

  <div id="tab-archive-content" class="tab-content">
    <div class="section-header">
      <div class="section-title"><i class="fa-solid fa-box-archive"></i> سجل المشاهدة</div>
      <div class="view-all" onclick="clearArchive()" style="color:var(--danger);">حذف الكل</div>
    </div>
    <div class="movies-grid" id="archiveContainer"></div>
  </div>

  <div id="tab-favorites-content" class="tab-content">
    <div class="section-header"><div class="section-title"><i class="fa-solid fa-heart"></i> المفضلة</div></div>
    <div class="movies-grid" id="favoritesContainer"></div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="switchTab('home')"><i class="fa-solid fa-house"></i><span>الرئيسية</span></div>
    <div class="nav-item" id="nav-live" onclick="switchTab('live')"><i class="fa-solid fa-tv"></i><span>مباشر</span></div>
    <div class="nav-item" id="nav-movies" onclick="switchTab('movies')"><i class="fa-solid fa-film"></i><span>أفلام</span></div>
    <div class="nav-item" id="nav-series" onclick="switchTab('series')"><i class="fa-solid fa-video"></i><span>مسلسلات</span></div>
    <div class="nav-item" id="nav-archive" onclick="switchTab('archive')"><i class="fa-solid fa-box-archive"></i><span>السجل</span></div>
  </div>

  <div class="player-overlay" id="playerOverlay">
    <div class="player-topbar">
      <div class="player-back" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></div>
      <div class="player-title" id="playerTitleText"></div>
    </div>
    <div id="clapprPlayer"></div>
  </div>

  <div class="modal" id="seriesModal">
    <div class="modal-header">
      <div style="font-size:16px; font-weight:800; color:#fff;" id="seriesModalTitle">الحلقات</div>
      <div style="color:var(--danger); cursor:pointer;" onclick="closeSeriesDetail()"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div id="seriesModalContent" class="episodes-list"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCfdoF9JcuQqYXw5rIsz_PjnrVM68syE7M",
      authDomain: "ahmedtv-cb49c.firebaseapp.com",
      databaseURL: "https://ahmedtv-cb49c-default-rtdb.firebaseio.com",
      projectId: "ahmedtv-cb49c",
      storageBucket: "ahmedtv-cb49c.firebasestorage.app",
      messagingSenderId: "168430987024",
      appId: "1:168430987024:web:ff0358fdf169156a632795"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allAccounts = [];
    let allChannels = [], allMovies = [], allSeries = [];
    let filteredChannels = [], filteredMovies = [], filteredSeries = [];
    let activeTabId = 'home';
    let playerInstance = null;

    // Cache Functions for 0-second fast loading
    function setCache(key, val) { try { localStorage.setItem('fast_cache_' + key, JSON.stringify(val)); } catch(e){} }
    function getCache(key) { try { return JSON.parse(localStorage.getItem('fast_cache_' + key)); } catch(e){ return null; } }

    const religiousKeywords = ['مزامير', 'قداسات', 'قصص', 'الكتاب المقدس', 'أبونا', 'الانبا', 'Qodasat', 'Karas'];
    function isReligious(name) { return name && religiousKeywords.some(kw => name.toLowerCase().includes(kw.toLowerCase())); }
    function filterReligious(arr) { return arr.filter(item => !isReligious(item.name)); }
    function escapeStr(str) { return str ? String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;') : ''; }

    function loadFastData() {
      // 1. Restore from Cache Immediately
      const cachedCh = getCache('channels');
      const cachedMo = getCache('movies');
      const cachedSe = getCache('series');

      if (cachedCh) { allChannels = cachedCh; filteredChannels = cachedCh; }
      if (cachedMo) { allMovies = cachedMo; filteredMovies = cachedMo; }
      if (cachedSe) { allSeries = cachedSe; filteredSe = cachedSe; }

      if (cachedCh || cachedMo || cachedSe) {
        hideSpinner();
        renderHome();
      }

      // 2. Fetch Fresh Data in Background (Progressive)
      firebase.auth().signInAnonymously().catch(()=>{});
      db.collection('accounts').get().then(snapshot => {
        allAccounts = [];
        snapshot.forEach(doc => { if (doc.data().host) allAccounts.push(doc.data()); });
        if (allAccounts.length > 0) fetchStreamsProgressive();
      }).catch(err => hideSpinner());
    }

    function fetchStreamsProgressive() {
      allAccounts.forEach(acc => {
        // Live
        fetch(`${acc.host}/player_api.php?username=${acc.user}&password=${acc.pass}&action=get_live_streams`)
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data)) {
              data.forEach(item => item.__acc = acc);
              allChannels = filterReligious([...allChannels, ...data]);
              // Deduplicate
              allChannels = Array.from(new Map(allChannels.map(item => [item.stream_id, item])).values());
              filteredChannels = allChannels;
              setCache('channels', allChannels);
              hideSpinner();
              if (activeTabId === 'home') renderHome();
              else if (activeTabId === 'live') renderGrid(filteredChannels, 'fullLiveContainer', 'live');
            }
          }).catch(()=>{});

        // Movies
        fetch(`${acc.host}/player_api.php?username=${acc.user}&password=${acc.pass}&action=get_vod_streams`)
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data)) {
              data.forEach(item => item.__acc = acc);
              allMovies = filterReligious([...allMovies, ...data]);
              allMovies = Array.from(new Map(allMovies.map(item => [item.stream_id, item])).values());
              filteredMovies = allMovies;
              setCache('movies', allMovies);
              hideSpinner();
              if (activeTabId === 'home') renderHome();
              else if (activeTabId === 'movies') renderGrid(filteredMovies, 'fullMoviesContainer', 'movie');
            }
          }).catch(()=>{});

        // Series
        fetch(`${acc.host}/player_api.php?username=${acc.user}&password=${acc.pass}&action=get_series`)
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data)) {
              data.forEach(item => item.__acc = acc);
              allSeries = filterReligious([...allSeries, ...data]);
              allSeries = Array.from(new Map(allSeries.map(item => [item.series_id, item])).values());
              filteredSeries = allSeries;
              setCache('series', allSeries);
              hideSpinner();
              if (activeTabId === 'home') renderHome();
              else if (activeTabId === 'series') renderGrid(filteredSeries, 'fullSeriesContainer', 'series');
            }
          }).catch(()=>{});
      });
    }

    function renderHome() {
      const homeLive = document.getElementById('homeLiveContainer');
      const homeMovies = document.getElementById('homeMoviesContainer');
      const homeSeries = document.getElementById('homeSeriesContainer');

      if (allChannels.length) {
        homeLive.innerHTML = allChannels.slice(0, 12).map(ch => {
          const url = `${ch.__acc.host}/live/${ch.__acc.user}/${ch.__acc.pass}/${ch.stream_id}.m3u8`;
          return `<div class="chip-card" onclick="openPlayer('${escapeStr(url)}','${escapeStr(ch.name)}',true)">
            <img src="${ch.stream_icon||''}" onerror="this.src='https://via.placeholder.com/60?text=TV'">
            <div class="chip-title">${ch.name}</div>
          </div>`;
        }).join('');
      }

      if (allMovies.length) {
        homeMovies.innerHTML = allMovies.slice(0, 12).map(m => {
          const url = `${m.__acc.host}/movie/${m.__acc.user}/${m.__acc.pass}/${m.stream_id}.${m.container_extension||'mp4'}`;
          return `<div class="movie-card" onclick="openPlayer('${escapeStr(url)}','${escapeStr(m.name)}',false)">
            <img class="movie-poster" src="${m.stream_icon||''}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=Movie'">
            <div class="movie-title">${m.name}</div>
          </div>`;
        }).join('');
      }

      if (allSeries.length) {
        homeSeries.innerHTML = allSeries.slice(0, 12).map(s => {
          return `<div class="movie-card" onclick="openSeriesDetail(${s.series_id},'${escapeStr(s.name)}','${escapeStr(s.__acc.host)}','${escapeStr(s.__acc.user)}','${escapeStr(s.__acc.pass)}')">
            <img class="movie-poster" src="${s.cover||''}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=Series'">
            <div class="movie-title">${s.name}</div>
          </div>`;
        }).join('');
      }
    }

    function renderGrid(data, containerId, type) {
      const container = document.getElementById(containerId);
      if (!container) return;
      if (!data.length) { container.innerHTML = '<div class="empty-state"><p>لا توجد نتائج</p></div>'; return; }

      if (type === 'live') {
        container.innerHTML = data.slice(0, 30).map(ch => {
          const url = `${ch.__acc.host}/live/${ch.__acc.user}/${ch.__acc.pass}/${ch.stream_id}.m3u8`;
          return `<div class="channel-item" onclick="openPlayer('${escapeStr(url)}','${escapeStr(ch.name)}',true)">
            <div class="channel-logo-box"><img src="${ch.stream_icon||''}" onerror="this.src='https://via.placeholder.com/60?text=TV'"></div>
            <div class="channel-info"><div class="channel-name">${ch.name}</div></div>
            <div class="channel-play-btn"><i class="fa-solid fa-play"></i></div>
          </div>`;
        }).join('');
      } else if (type === 'movie') {
        container.innerHTML = data.slice(0, 30).map(m => {
          const url = `${m.__acc.host}/movie/${m.__acc.user}/${m.__acc.pass}/${m.stream_id}.${m.container_extension||'mp4'}`;
          return `<div class="movie-card" onclick="openPlayer('${escapeStr(url)}','${escapeStr(m.name)}',false)">
            <img class="movie-poster" src="${m.stream_icon||''}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=Movie'">
            <div class="movie-title">${m.name}</div>
          </div>`;
        }).join('');
      } else if (type === 'series') {
        container.innerHTML = data.slice(0, 30).map(s => {
          return `<div class="movie-card" onclick="openSeriesDetail(${s.series_id},'${escapeStr(s.name)}','${escapeStr(s.__acc.host)}','${escapeStr(s.__acc.user)}','${escapeStr(s.__acc.pass)}')">
            <img class="movie-poster" src="${s.cover||''}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=Series'">
            <div class="movie-title">${s.name}</div>
          </div>`;
        }).join('');
      }
    }

    function openPlayer(url, title, isHls) {
      document.getElementById('playerOverlay').classList.add('active');
      document.getElementById('playerTitleText').innerText = title || '';
      if (playerInstance) { playerInstance.destroy(); playerInstance = null; }
      document.getElementById('clapprPlayer').innerHTML = '';

      const isMp4 = url.toLowerCase().includes('.mp4') && !url.toLowerCase().includes('/live/');
      playerInstance = new Clappr.Player({
        source: url,
        parentId: "#clapprPlayer",
        mimeType: isMp4 ? 'video/mp4' : 'application/x-mpegURL',
        width: '100%', height: '100%', autoPlay: true,
        playback: { playInline: true },
        hlsjsConfig: { enableWorker: true, xhrSetup: (xhr) => { xhr.withCredentials = false; } }
      });
    }

    function closePlayer() {
      if (playerInstance) { playerInstance.destroy(); playerInstance = null; }
      document.getElementById('clapprPlayer').innerHTML = '';
      document.getElementById('playerOverlay').classList.remove('active');
    }

    function switchTab(tabId) {
      activeTabId = tabId;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId + '-content')?.classList.add('active');
      document.getElementById('nav-' + tabId)?.classList.add('active');
      window.scrollTo(0, 0);

      if (tabId === 'home') renderHome();
      else if (tabId === 'live') renderGrid(filteredChannels, 'fullLiveContainer', 'live');
      else if (tabId === 'movies') renderGrid(filteredMovies, 'fullMoviesContainer', 'movie');
      else if (tabId === 'series') renderGrid(filteredSeries, 'fullSeriesContainer', 'series');
    }

    function hideSpinner() {
      const s = document.getElementById('globalSpinner');
      if (s) { s.style.opacity = '0'; setTimeout(() => s.style.display = 'none', 300); }
    }
    function openDrawer() { document.getElementById('sideDrawer').classList.add('active'); document.getElementById('drawerBackdrop').classList.add('active'); }
    function closeDrawer() { document.getElementById('sideDrawer').classList.remove('active'); document.getElementById('drawerBackdrop').classList.remove('active'); }

    window.onload = loadFastData;
  </script>
</body>
</html>
